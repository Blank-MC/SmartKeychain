; ============================================================
;  SMART DIGITAL KEYCHAIN - hadiah ulang tahun Erika (14 Nov)
;  Board : ESP32-C3 SuperMini (esp32-c3-devkitm-1)
; ============================================================
[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; ------------------------------------------------------------
;  PILIH LAYAR -> buka src/config.h
;    #define USE_WOKWI_LCD   aktif  = ILI9341 320x240 (Wokwi)
;    #define USE_WOKWI_LCD   dikomentari = ST7789 240x280 (asli)
;
;  Animasi mata memakai TFT_RoboEyes (RoboEyes versi TFT,
;  menggambar langsung tanpa framebuffer OLED).
; ------------------------------------------------------------

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/Adafruit ST7735 and ST7789 Library
    shourov-paul/TFT_RoboEyes
